 <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0fb"/><stop offset=".45" stop-color="#db8cff"/><stop offset="1" stop-color="#6c3dbb"/></linearGradient>
